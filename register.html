<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HireWise | Register</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Auth CSS -->
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">

                <h1>HireWise</h1>

                <p>Create your account</p>

            </div>

            <div id="alertBox" class="auth-alert"></div>

            <form id="registerForm" method="POST">

                <div class="input-group">

                    <label>Full Name</label>

                    <input type="text" id="name" name="name" placeholder="Enter your full name" required minlength="2">

                </div>

                <div class="input-group">

                    <label>Email Address</label>

                    <input type="email" id="email" name="email" placeholder="Enter your email" required>

                </div>

                <div class="input-group">

                    <label>Password</label>

                    <input type="password" id="password" name="password" placeholder="Create a password" required minlength="6">

                </div>

                <div class="input-group">

                    <label>Confirm Password</label>

                    <input type="password" id="confirmPassword" name="confirm_password" placeholder="Confirm your password" required minlength="6">

                </div>

                <button type="submit" class="login-btn" id="submitBtn">
                    Create Account
                </button>

            </form>

            <div class="bottom-text">

                Already have an account?

                <a href="login.html">Login</a>

            </div>

        </div>

    </div>

    <script src="js/script.js"></script>
</body>

</html>
